name: Release

# Bump + publish in one manual dispatch. Publishes to npm via Trusted
# Publishing (OIDC) — no tokens, no OTP. Requires the GitHub Actions trusted
# publisher to be configured on npmjs.com for this package (repo
# ironheart122/proxenos, workflow release.yml).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          # Keep the README install pin tracking the release.
          sed -i -E "s/proxenos@[0-9]+\.[0-9]+\.[0-9]+/proxenos@${VERSION}/g" README.md
          git add package.json README.md
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # OIDC needs a recent npm; Node 24's bundled npm may predate trusted
      # publishing support.
      - name: Update npm
        run: npm install -g npm@latest

      # Publish before pushing the bump commit: if publish fails, the repo
      # stays untouched and the run can simply be re-dispatched.
      - name: Publish to npm (trusted publishing)
        run: npm publish

      # Push the tag by name — --follow-tags skips lightweight tags silently,
      # which left v0.1.4 unpushed on the first release.
      - name: Push bump commit and tag
        run: git push origin dev "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
